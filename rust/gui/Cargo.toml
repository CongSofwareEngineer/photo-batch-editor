[package]
name = "pbe-gui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Photo Batch Editor — GUI (egui + wgpu), Rust port of the PySide6 ui/ package"

[lib]
name = "pbe_gui"
path = "src/lib.rs"

[[bin]]
name = "photo-batch-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.36.2"
pbe-core = { path = "../core" }
rfd = "0.17.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[package.metadata.bundle]
name = "Photo Batch Editor"
identifier = "com.photobatcheditor.app"
icon = ["../../assets/icon.icns", "../../assets/icon.png"]
resources = ["../../assets", "../../models", "../../ffmpeg", "README.txt"]
copyright = "Copyright © Photo Batch Editor"
category = "Graphics and Design"
short_description = "Photo Batch Editor"
long_description = "Batch edit photos and edit single photos/videos with filters, adjustments, and effects."
osx_minimum_system_version = "10.15"
