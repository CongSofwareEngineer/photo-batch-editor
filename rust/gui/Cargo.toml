[package]
name = "pbe-gui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Photo Batch Editor — GUI (egui + wgpu), Rust port of the PySide6 ui/ package"

[lib]
name = "pbe_gui"
path = "src/lib.rs"

[[bin]]
name = "photo-batch-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.36.2"
pbe-core = { path = "../core" }
rfd = "0.17.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
